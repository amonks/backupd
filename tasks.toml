# This task is how the committed _templ.go files are produced: run from
# the module dir, so their embedded FileNames are module-relative
# (`daemon/layout.templ`). Generating from anywhere else — a bare
# `templ generate` at the repo root, or `-path` pointed at a
# subdirectory — writes different FileNames and dirties the tree, which
# is worth knowing before reaching for either. Note also that a
# positional path is ignored; the flag is `-path`.
[[task]]
  id = "templ"
  type = "short"
  watch = ["*.templ", "daemon/*.templ"]
  cmd = "go tool templ generate ."

# This module publishes to a public mirror, so `publish-validate` checks it
# with `GOWORK=off go mod tidy -diff`, and `generate` re-tidies only modules
# that own a tidy task — see specs/publish.md.
[[task]]
  id = "tidy"
  type = "short"
  cmd = "go mod tidy -e"

# `generate` runs templ so CI's dirty-tree check verifies the committed
# _templ.go files against their sources, the way it does for every other
# templ app. That only works because this task and the committed files
# agree on where generation runs from; see the templ task above.
[[task]]
  id = "generate"
  type = "short"
  dependencies = ["tidy", "templ"]

[[task]]
  id = 'test'
  type = 'short'
  dependencies = [
    'go-test',
    'go-vet',
    'gofix',
    'staticcheck',
    'govulncheck',
  ]

[[task]]
  id = 'go-test'
  type = 'short'
  dependencies = ['templ']
  cmd = 'go test ./...'

[[task]]
  id = 'go-vet'
  type = 'short'
  dependencies = ['templ']
  cmd = 'go vet ./...'

[[task]]
  id = 'gofix'
  type = 'short'
  dependencies = ['templ']
  cmd = 'test -z "$(go fix -diff ./...)"'

[[task]]
  id = 'staticcheck'
  type = 'short'
  dependencies = ['templ']
  cmd = 'go tool staticcheck ./...'

[[task]]
  id = 'govulncheck'
  type = 'short'
  dependencies = ['templ']
  cmd = 'go tool govulncheck ./...'
